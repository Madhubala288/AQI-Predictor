name: AQI Training Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  training:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate feature store
        run: |
          python -c "import pandas as pd; df=pd.read_csv('feature_store/features_v1.csv'); print('Feature Store Shape:', df.shape); assert len(df) > 0; print('Feature store validation passed.')"

      - name: Train model
        run: python scripts/train_model.py

      - name: Evaluate model
        run: python scripts/evaluate_model.py

      - name: Register best model
        run: python scripts/register_model.py

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/
            model_registry/
            reports/evaluation_report.md
            reports/evaluation_charts/